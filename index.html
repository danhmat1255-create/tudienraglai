<script>
    const dict = new Map();
    const indexedKeys = {};
    const VALID_CHARS = /[a-zA-Zàáảãạâầấẩẫậăằắẳẵặèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/;

    async function khoiTao() {
        const raw = document.getElementById('raw_data').textContent;
        const lines = raw.split('\n').filter(l => l.includes('|'));
        const total = lines.length;
        
        const progress = document.getElementById('progress');
        const status = document.getElementById('loadStatus');

        let i = 0;
        const batchSize = 100;

        async function step() {
            const limit = Math.min(i + batchSize, total);
            for (; i < limit; i++) {
                const line = lines[i].toLowerCase().trim();
                const parts = line.split('|').map(s => s.trim());
                if (parts.length < 2) continue;
                
                const ragStr = parts[0];
                const vieStr = parts[1];

                const ragParts = ragStr.split('/').map(s => s.trim());
                const vieParts = vieStr.split('/').map(s => s.trim());

                ragParts.forEach(r => {
                    if (r) {
                        dict.set(r, { trans: vieStr, type: 'r' });
                        addKeyToIndex(r);
                    }
                });

                vieParts.forEach(v => {
                    if (v) {
                        dict.set(v, { trans: ragStr, type: 'v' });
                        addKeyToIndex(v);
                    }
                });
            }

            const pct = Math.floor((i / total) * 100);
            progress.style.width = pct + '%';
            status.innerText = `Đang nạp dữ liệu: ${pct}% (${i}/${total})`;

            if (i < total) {
                setTimeout(step, 0);
            } else {
                finalize();
            }
        }
        step();
    }

    function addKeyToIndex(key) {
        const char = key[0];
        if (!indexedKeys[char]) indexedKeys[char] = new Set();
        indexedKeys[char].add(key);
    }

    function finalize() {
        for (const char in indexedKeys) {
            indexedKeys[char] = Array.from(indexedKeys[char]).sort((a, b) => b.length - a.length);
        }
        document.getElementById('loadStatus').innerText = "✅ ĐÃ SẴN SÀNG!";
        const btn = document.getElementById('btnDich');
        btn.disabled = false;
        btn.innerText = "DỊCH NGAY";
    }

    function isWordBoundary(text, index, len) {
        const prev = text[index - 1], next = text[index + len];
        return (!prev || !VALID_CHARS.test(prev)) && (!next || !VALID_CHARS.test(next));
    }

    function xuLyDich() {
        const input = document.getElementById("input").value.trim();
        if (!input) return;

        const lowInput = input.toLowerCase();
        let i = 0, tokens = [];

        while (i < lowInput.length) {
            if (/\s|[.,!?;:]/.test(lowInput[i])) {
                tokens.push({ val: input[i], isRaw: true });
                i++; continue;
            }

            let found = false;
            const char = lowInput[i];
            const list = indexedKeys[char] || [];

            for (const key of list) {
                if (lowInput.startsWith(key, i) && isWordBoundary(lowInput, i, key.length)) {
                    let data = dict.get(key);
                    let transVal = data.trans;

                    const meanings = transVal.split('/').map(m => m.trim());
                    const first = meanings[0];
                    const others = meanings.slice(1).join(', ');

                    tokens.push({ first, others, isTranslated: true });
                    i += key.length; found = true; break;
                }
            }

            if (!found) {
                let j = i;
                while (j < lowInput.length && !/\s|[.,!?;:]/.test(lowInput[j])) j++;
                tokens.push({ val: input.substring(i, j), isRaw: true });
                i = j;
            }
        }

        const res = tokens.map(tk => {
    if (tk.isTranslated) {
        if (tk.others) {
            // Thêm class 'has-multiple' nếu có nhiều nghĩa
            return `<span class="highlight has-multiple" onclick="this.classList.toggle('expanded')">${tk.first}<span class="more-meanings"> (${tk.others})</span></span>`;
        }
        return `<span class="highlight">${tk.first}</span>`;
    }
    return tk.val;
}).join("");

        document.getElementById("output").innerHTML = res;
    }

    window.onload = khoiTao;
</script>
