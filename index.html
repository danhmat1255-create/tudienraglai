<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raglai Translate v3.3</title>
    <style>
        :root { 
            --primary: #1a73e8; 
            /* Thay đổi đường dẫn URL ảnh của bạn ở đây */
            --bg-image: url('https://raw.githubusercontent.com/danhmat1255-create/tudienraglai/refs/heads/main/12.jpg'); 
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            width: 100vw;
            display: flex;
           display: flex;
			align-items: flex-end;   /* Đẩy toàn bộ nội dung bên trong xuống sát đáy */
			justify-content: center; /* Giữ khung luôn ở chính giữa theo chiều ngang */
		}

        /* NỀN HÌNH ẢNH TOÀN MÀN HÌNH */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--bg-image);
            background-size: contain;
            background-position: center top; /* Đẩy ảnh lên sát đỉnh màn hình để  bị khung tra cứu che mất */
          	background-repeat: no-repeat;
    		background-color: #000;          /* Thêm nền đen (hoặc màu tối) cho những khoảng trống còn dư phía dưới */
   			z-index: -1;
		}

        /* KHUNG TRA CỨU: NẰM LƠ LỬNG CHÍNH GIỮA Ở NỬA DƯỚI */
        .container { 
            background: rgba(255, 255, 255, 0.88); /* Tăng độ đậm một chút để dễ đọc chữ */
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            width: 95%; 
            max-width: 500px; /* Khống chế chiều rộng tối đa vừa vặn */
            padding: 22px; 
            margin-bottom: 15px; /* Khoảng cách an toàn với đáy màn hình */
            border-radius: 24px; /* Bo tròn góc hiện đại, mềm mại */
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            animation: fadeInBlur 0.5s ease-out;
        }

        @keyframes fadeInBlur {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            color: #111; 
            text-align: center; 
            margin-top: 5px; 
            margin-bottom: 12px; 
            font-size: 19px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .status-container { margin-bottom: 15px; }
        .progress-bar { width: 100%; height: 4px; background: rgba(0,0,0,0.08); border-radius: 2px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #34a853; transition: width 0.1s; }
        .status-text { text-align: center; color: #5f6368; font-size: 11px; margin-top: 5px; font-weight: bold; letter-spacing: 0.5px; }
        
        textarea { 
            width: 100%; 
            height: 95px; 
            padding: 12px 15px; 
            border: 1px solid rgba(0,0,0,0.12); 
            border-radius: 14px; 
            font-size: 16px; 
            outline: none; 
            resize: none; 
            background: rgba(255,255,255,0.75);
            font-family: inherit;
            transition: all 0.2s;
        }
        textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
        
        .btn-dich { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(26,115,232,0.25);
            transition: all 0.2s; 
        }
        .btn-dich:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        .btn-dich:not(:disabled):active { transform: scale(0.98); background: #1557b0; }
        
        .result-box { 
            margin-top: 12px; 
            padding: 14px 15px; 
            background: rgba(255, 255, 255, 0.65); 
            border-radius: 14px; 
            border-left: 4px solid var(--primary); 
            min-height: 50px; 
            max-height: 180px;
            overflow-y: auto;
        }
        
        #output { font-size: 17px; line-height: 1.6; color: #202124; word-wrap: break-word; }
        .normal-word { display: inline; }
        
        .multiple-meanings-block {
            display: block; 
            margin: 6px 0;
            padding: 6px 10px;
            background: rgba(232, 240, 254, 0.8);
            border-radius: 8px;
            border-left: 3px solid #34a853;
        }
        .meaning-row { display: block; font-size: 16px; margin-bottom: 4px; color: #202124; }
        .meaning-row:last-child { margin-bottom: 0; }
        
        .word-note {
            font-size: 12px;
            color: #1a73e8;
            font-weight: bold;
            background: #fff;
            padding: 1px 5px;
            border-radius: 4px;
            margin-right: 6px;
            display: inline-block;
        }

        /* ĐÃ SỬA: ĐỐI VỚI GIAO DIỆN MÁY TÍNH / MÀN HÌNH NGANG */
        @media (min-width: 769px) {
            body {
                align-items: flex-end; /* Vẫn giữ ở nửa dưới */
                justify-content: center; /* CHÍNH GIỮA màn hình,  lệch phải */
            }
            .container {
                width: 450px;
                margin-bottom: 40px; /* Nằm gọn gàng ở cạnh dưới trung tâm */
                background: rgba(255, 255, 255, 0.92); /* Tăng độ tương phản rõ nét trên PC */
            }
        }
    </style>
</head>

<script>
    function docSoTiengViet(n) {
        const chu = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
        if (n === 0) return chu[0];

        function doc3So(num, showTram) {
            let tram = Math.floor(num / 100);
            let chuc = Math.floor((num % 100) / 10);
            let dv = num % 10;
            let st = "";

            if (tram > 0 || showTram) {
                st = chu[tram] + " trăm";
                if (chuc === 0 && dv !== 0) st += " lẻ";
            }
            if (chuc === 1) st += " mười";
            else if (chuc > 1) st += " " + chu[chuc] + " mươi";

            if (dv === 1 && chuc > 1) st += " mốt";
            else if (dv === 5 && chuc > 0) st += " lăm";
            else if (dv !== 0) st += " " + chu[dv];
            
            return st.trim();
        }

        let ketQua = "";
        let ty = Math.floor(n / 1000000000);
        let trieu = Math.floor((n % 1000000000) / 1000000);
        let nghin = Math.floor((n % 1000000) / 1000);
        let donvi = n % 1000;

        if (ty > 0) ketQua += doc3So(ty, false) + " tỷ ";
        if (trieu > 0) ketQua += doc3So(trieu, ty > 0) + " triệu ";
        if (nghin > 0) ketQua += doc3So(nghin, trieu > 0) + " nghìn ";
        if (donvi > 0 || ketQua === "") ketQua += doc3So(donvi, nghin > 0 || trieu > 0);

        return ketQua.trim();
    }

    const dict = new Map();
    const indexedKeys = {};
    const VALID_CHARS = /[a-zA-Zàáảãạâầấẩẫậăằắẳẵặèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/;

    function khoiTao() {
        const raw = document.getElementById('raw_data').textContent;
        const lines = raw.split('\n').filter(l => l.includes('|'));
        const total = lines.length;
        
        const progress = document.getElementById('progress');
        const status = document.getElementById('loadStatus');

        let i = 0;
        const batchSize = 100;

        function step() {
            const limit = Math.min(i + batchSize, total);
            
            for (; i < limit; i++) {
                const line = lines[i].toLowerCase().trim();
                const parts = line.split('|').map(s => s.trim());
                if (parts.length < 2) continue;
                
                const ragStr = parts[0];
                const vieStr = parts[1];

                const ragParts = ragStr.split('/').map(s => s.trim());
                const vieParts = vieStr.split('/').map(s => s.trim());

                ragParts.forEach(r => {
                    if (r) {
                        dict.set(r, { original: r, trans: vieStr, type: 'r' });
                        addKeyToIndex(r);
                    }
                });

                vieParts.forEach(v => {
                    if (v) {
                        dict.set(v, { original: v, trans: ragStr, type: 'v' });
                        addKeyToIndex(v);
                    }
                });
            }

            const pct = Math.floor((i / total) * 100);
            progress.style.width = pct + '%';
            status.innerText = `Đang tải: ${pct}%`;

            if (i < total) {
                setTimeout(step, 0);
            } else {
                finalize();
            }
        }
        step();
    }

    function addKeyToIndex(key) {
        const char = key[0];
        if (!indexedKeys[char]) indexedKeys[char] = new Set();
        indexedKeys[char].add(key);
    }

    function finalize() {
        for (const char in indexedKeys) {
            indexedKeys[char] = Array.from(indexedKeys[char]).sort((a, b) => b.length - a.length);
        }
        document.getElementById('loadStatus').innerText = "✅ SẴN SÀNG TRA CỨU";
        const btn = document.getElementById('btnDich');
        btn.disabled = false;
        btn.innerText = "DỊCH NGAY";
    }

    function isWordBoundary(text, index, len) {
        const prev = text[index - 1], next = text[index + len];
        return (!prev || !VALID_CHARS.test(prev)) && (!next || !VALID_CHARS.test(next));
    }

    function xuLyDich() {
        let rawInput = document.getElementById("input").value.trim();
        if (!rawInput) return;

        let lowInput = rawInput.toLowerCase();
        let i = 0, tokens = [];

        while (i < lowInput.length) {
            if (/\s|[.,!?;:]/.test(rawInput[i])) {
                tokens.push({ val: rawInput[i], isRaw: true });
                i++; continue;
            }

            let textRest = lowInput.substring(i);
            let matchNam = textRest.match(/^năm\s+(\d+)/);
            
            if (matchNam) {
                tokens.push({ htmlContent: '<span class="normal-word">thut </span>', dangerHtml: true });
                i += matchNam[0].split(' ')[0].length;
                continue;
            }

            if (/\d/.test(lowInput[i])) {
                let j = i;
                while (j < lowInput.length && /\d/.test(lowInput[j])) j++;
                let numStr = lowInput.substring(i, j);
                let chuViet = docSoTiengViet(parseInt(numStr));
                let words = chuViet.split(/\s+/);
                let raglaiResult = words.map(word => dict.has(word) ? dict.get(word).trans.split('/')[0].trim() : word).join(" ");
                tokens.push({ htmlContent: `<span class="normal-word">${raglaiResult}</span>`, dangerHtml: true });
                i = j; continue;
            }

            let found = false;
            const char = lowInput[i];
            const list = indexedKeys[char] || [];

            for (const key of list) {
                if (lowInput.startsWith(key, i) && isWordBoundary(lowInput, i, key.length)) {
                    let data = dict.get(key);
                    let meanings = data.trans.split('/').map(m => m.trim());

                    if (key === "không") {
                        let sau = lowInput.substring(i + key.length).trim();
                        let finalMeaning = (sau.includes("?") || sau === "" || /^[.!]/.test(sau)) ? "cet" : "oh";
                        meanings = [finalMeaning];
                    }

                    let htmlResult = "";
                    if (meanings.length <= 1) {
                        htmlResult = `<span class="normal-word">${meanings[0]} </span>`;
                    } else {
                        htmlResult = `<div class="multiple-meanings-block">`;
                        meanings.forEach(m => {
                            htmlResult += `<span class="meaning-row"><span class="word-note">${key}</span>→ ${m}</span>`;
                        });
                        htmlResult += `</div>`;
                    }
                    
                    tokens.push({ htmlContent: htmlResult, dangerHtml: true });
                    i += key.length; found = true; break;
                }
            }

            if (!found) {
                let j = i;
                while (j < lowInput.length && !/\s|[.,!?;:]/.test(lowInput[j]) && !/\d/.test(lowInput[j])) j++;
                tokens.push({ val: rawInput.substring(i, j) + " ", isRaw: true });
                i = j;
            }
        }

        const res = tokens.map(tk => {
            if (tk.dangerHtml) return tk.htmlContent;
            return tk.val;
        }).join("");

        document.getElementById("output").innerHTML = res;
    }
    
    window.onload = khoiTao;
</script>
